<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Learning Issue Analyzer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      padding: 12px;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      margin-top: 12px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    .result-section {
      margin-top: 32px;
    }

    .main-goal-card {
      border: 1px solid #ddd;
      padding: 16px;
      margin-bottom: 24px;
      border-radius: 8px;
      background: #fafafa;
    }

    .issue-card {
      border: 1px solid #ddd;
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 8px;
    }

    .issue-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .issue-title {
      font-size: 18px;
      font-weight: bold;
    }

    .tag-row {
      margin: 8px 0;
    }

    .tag {
      display: inline-block;
      padding: 4px 8px;
      margin-right: 8px;
      border: 1px solid #ccc;
      border-radius: 999px;
      font-size: 13px;
      background: #f7f7f7;
    }

    .field {
      margin-top: 10px;
    }

    .field-label {
      font-weight: bold;
    }

    .empty {
      color: #777;
      font-style: italic;
    }

    .error {
      color: darkred;
      white-space: pre-wrap;
    }
    .goal-thread-card {
    border: 2px solid #333;
    border-radius: 10px;
    padding: 16px;
    margin-top: 20px;
    background-color: #f7f7f7;
}

    .issue-card {
        border: 1px solid #aaa;
        border-radius: 8px;
        padding: 12px;
        margin-top: 12px;
        background-color: #ffffff;
    }

    .goal-thread-card h3 {
        margin-top: 0;
    }

    .issue-card h4 {
        margin-top: 0;
    }
  </style>
</head>

<body>
  <h1>Learning Issue Analyzer</h1>

  <p>
    Paste an AI-assisted learning conversation below. The system will extract the main goal and related learning issues.
  </p>

  <textarea
    id="conversation"
    placeholder="Paste your ChatGPT / Claude / Gemini learning conversation here..."
  ></textarea>

  <br />

  <button onclick="analyze()">Analyze</button>

  <div id="result" class="result-section"></div>

  <script>
    async function analyze() {
        const text = document.getElementById("conversation").value.trim();
        const resultBox = document.getElementById("result");
    
        if (!text) {
            resultBox.innerHTML = "<p>Please paste a conversation first.</p>";
            return;
        }
    
        resultBox.innerHTML = "<p>Analyzing...</p>";
    
        try {
            const response = await fetch("http://127.0.0.1:8000/analyze", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    conversation_text: text
                })
            });
    
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || `Backend returned status ${response.status}`);
            }

            renderResult(data);
    
        } catch (error) {
            resultBox.innerHTML = "";
    
            const errorBox = document.createElement("pre");
            errorBox.textContent = "Error: " + error.message;
            resultBox.appendChild(errorBox);
    
            console.error(error);
        }
    }
    
    function renderResult(data) {
        const resultBox = document.getElementById("result");
        resultBox.innerHTML = "";
    
        if (!data.goal_threads || !Array.isArray(data.goal_threads)) {
            const errorBox = document.createElement("pre");
            errorBox.textContent = "Unexpected response format:\n" + JSON.stringify(data, null, 2);
            resultBox.appendChild(errorBox);
            return;
        }
    
        const heading = document.createElement("h2");
        heading.textContent = "Goal Threads";
        resultBox.appendChild(heading);
    
        data.goal_threads.forEach((thread, index) => {
            const threadCard = createGoalThreadCard(thread, index);
            resultBox.appendChild(threadCard);
        });
    }
    
    function createGoalThreadCard(thread, index) {
        const card = document.createElement("div");
        card.className = "goal-thread-card";
    
        const title = document.createElement("h3");
        title.textContent = `${thread.goal_id || "G" + (index + 1)}: ${thread.main_goal}`;
        card.appendChild(title);
    
        addField(card, "Status", thread.status || "unknown");
        addField(card, "Summary", thread.summary);
    
        const issueHeading = document.createElement("h4");
        issueHeading.textContent = "Issues";
        card.appendChild(issueHeading);
    
        if (thread.issues && Array.isArray(thread.issues) && thread.issues.length > 0) {
            thread.issues.forEach(issue => {
                const issueCard = createIssueCard(issue);
                card.appendChild(issueCard);
            });
        } else {
            const emptyText = document.createElement("p");
            emptyText.textContent = "No issues found for this goal thread.";
            card.appendChild(emptyText);
        }
    
        return card;
    }
    
    function createIssueCard(issue) {
        const card = document.createElement("div");
        card.className = "issue-card";
    
        const title = document.createElement("h4");
        title.textContent = issue.title || "Untitled issue";
        card.appendChild(title);
    
        addField(card, "Type", issue.type);
        addField(card, "Status", issue.status);
        addField(card, "Trigger", issue.trigger);
        addField(card, "Summary", issue.summary);
        addField(card, "Final Understanding", issue.final_understanding);
        addField(card, "Review Note", issue.review_note);
    
        return card;
    }
    
    function addField(parent, label, value) {
        const p = document.createElement("p");

        const labelElement = document.createElement("strong");
        labelElement.textContent = `${label}:`;
        p.appendChild(labelElement);
        p.appendChild(document.createTextNode(` ${value || ""}`));

        parent.appendChild(p);
    }
    </script>
</body>
</html>
